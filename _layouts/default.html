<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap">
  <style>
    /* IUSS visual identity: Blu istituzionale #163655, Azzurro corporate #3773A0, Grigio #E0DCDC; Arial Black for titles, Arial for text */
    :root {
      color-scheme: light;
      --blu: #163655;
      --azzurro: #3773A0;
      --grigio: #E0DCDC;
      --tint: #EBF1F7;
      --ink: #1E1E1E;
      --muted: #555B63;
      --line: #CFD8E3;
      --display: "Arial Black", "Archivo Black", Arial, sans-serif;
      --text: Arial, "Helvetica Neue", Helvetica, "Liberation Sans", sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: #F4F6F9; font: 17px/1.65 var(--text); }
    img { max-width: 100%; height: auto; }
    a { color: var(--azzurro); text-underline-offset: .18em; }
    a:hover { color: var(--blu); }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--azzurro); outline-offset: 3px; }

    /* Hero */
    .hero { background: var(--blu); color: #fff; padding: 40px 20px 56px; }
    .hero-inner { max-width: 1100px; margin: 0 auto; border: 1.5px solid rgba(255,255,255,.75); padding: 36px 32px 44px; text-align: center; }
    .logos { display: flex; align-items: center; justify-content: center; gap: 28px; flex-wrap: wrap; }
    .logos img { height: 52px; width: auto; }
    .logos .sep { width: 1px; height: 42px; background: rgba(255,255,255,.7); }
    .kicker { margin: 22px 0 6px; font-size: .8rem; letter-spacing: .2em; text-transform: uppercase; color: #CFDAE6; }
    .hero h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(1.45rem, 6.8vw, 3.6rem); line-height: 1.05; letter-spacing: .01em; color: #fff; }
    .hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: center; margin-top: 34px; text-align: left; }
    .hero-grid img { display: block; width: 100%; border: 5px solid #FAF8F2; }
    .tagline { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(1.7rem, 4vw, 2.5rem); line-height: 1.1; }
    .tagline-sub { margin: 8px 0 26px; font-style: italic; font-size: 1.15rem; color: #E6ECF2; }
    .date { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(1.4rem, 3vw, 1.9rem); letter-spacing: .01em; }
    .venue { margin: 4px 0 26px; color: #E6ECF2; }
    .btn { display: inline-block; padding: 12px 22px; background: var(--azzurro); color: #fff; text-decoration: none; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .85rem; border: 1.5px solid rgba(255,255,255,.85); }
    .btn:hover { background: #2C5F86; color: #fff; }
    .committee-hero { margin-top: 26px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.55); font-size: .95rem; }
    .committee-hero strong { display: block; font-size: .75rem; letter-spacing: .2em; margin-bottom: 6px; }

    /* Navigation */
    nav { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); }
    nav ul { max-width: 1100px; margin: 0 auto; padding: 0 20px; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 26px; }
    nav a { display: inline-block; padding: 14px 0; color: var(--blu); text-decoration: none; font-weight: 700; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; }
    nav a:hover { color: var(--azzurro); }

    /* Content */
    main { max-width: 1100px; margin: 0 auto; padding: 20px 20px 60px; }
    section { background: #fff; margin-top: 28px; padding: 40px 40px 44px; border-top: 6px solid var(--azzurro); scroll-margin-top: 64px; }
    h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 900; font-size: clamp(1.6rem, 3.5vw, 2.1rem); color: var(--azzurro); text-transform: uppercase; letter-spacing: .01em; }
    .sub { margin: 0 0 26px; padding-bottom: 14px; border-bottom: 2px solid var(--blu); color: var(--blu); font-style: italic; }
    .sub b { font-style: normal; font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: var(--azzurro); margin-right: 8px; }
    h3 { margin: 0 0 4px; color: var(--blu); }
    .lead { font-size: 1.12rem; font-style: italic; color: var(--blu); max-width: 900px; }
    .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border: 1.5px solid var(--blu); }
    .two > div { padding: 26px 28px; }
    .two > div + div { border-left: 1.5px solid var(--blu); background: #F2F6FA; }
    .boxhead { margin: -26px -28px 22px; padding: 10px 28px; background: var(--azzurro); color: #fff; font-weight: 700; font-size: .78rem; letter-spacing: .2em; text-transform: uppercase; }
    ol.obj { list-style: none; padding: 0; margin: 0; counter-reset: o; }
    ol.obj li { counter-increment: o; position: relative; padding-left: 46px; margin-bottom: 16px; }
    ol.obj li::before { content: counter(o, decimal-leading-zero); position: absolute; left: 0; top: -2px; font-family: var(--display); font-weight: 900; color: var(--azzurro); font-size: 1.2rem; }
    ol.obj strong { display: block; color: var(--blu); }
    ul.out { padding-left: 20px; margin: 0; }
    ul.out li::marker { color: var(--azzurro); }

    .day { margin-top: 38px; }
    .day:first-of-type { margin-top: 0; }
    .day-title { margin: 0; font-size: clamp(1.25rem, 3vw, 1.6rem); color: var(--blu); font-weight: 400; }
    .day-title span { font-family: var(--display); font-weight: 900; color: var(--azzurro); text-transform: uppercase; margin-right: 6px; }
    .theme { margin: 4px 0 16px; padding-bottom: 10px; border-bottom: 2px solid var(--blu); font-style: italic; color: var(--blu); }
    .theme b { font-style: normal; font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: var(--azzurro); margin-right: 6px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; min-width: 760px; border-collapse: collapse; font-size: .92rem; }
    th { text-align: left; background: var(--azzurro); color: #fff; font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; padding: 11px 13px; }
    td { padding: 13px; border-bottom: 1px solid var(--line); vertical-align: top; }
    td:first-child { white-space: nowrap; font-weight: 700; color: var(--blu); font-variant-numeric: tabular-nums; }
    th:nth-child(1) { width: 12%; } th:nth-child(2) { width: 20%; } th:nth-child(3) { width: 24%; } th:nth-child(4) { width: 44%; }
    tr.talk td:first-child { box-shadow: inset 4px 0 0 var(--azzurro); }
    tr.break td { background: var(--grigio); }
    tr.facil td { background: var(--tint); }
    .act { font-weight: 700; color: var(--blu); }
    .who { display: block; font-weight: 700; color: var(--azzurro); }
    .aff + .who { margin-top: 10px; }
    .aff { display: block; font-style: italic; color: var(--muted); font-size: .86rem; line-height: 1.45; }
    .lbl { display: block; font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--azzurro); font-weight: 700; }
    .talk-title { display: block; font-style: italic; color: var(--blu); font-size: 1.02rem; line-height: 1.35; margin: 2px 0 8px; }
    .dur { display: block; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--azzurro); font-weight: 700; }

    .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; border: 1.5px solid var(--blu); }
    .grid2 article { padding: 26px 28px; border-bottom: 1.5px solid var(--blu); }
    .grid2 article:nth-child(odd) { border-right: 1.5px solid var(--blu); }
    .grid2 article:nth-child(4n+2), .grid2 article:nth-child(4n+3) { background: #F2F6FA; }
    .grid2 article:nth-last-child(-n+2) { border-bottom: 0; }
    .name { margin: 0; font-family: var(--display); font-weight: 900; color: var(--blu); font-size: 1.2rem; }
    .role { margin: 2px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--azzurro); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--azzurro); }
    .bio { margin: 0; font-size: .95rem; }
    .speaker { padding: 24px 28px; margin-bottom: 18px; background: #F2F6FA; border-left: 5px solid var(--azzurro); }
    .slot { margin: 0; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--azzurro); }
    .speaker .talk-title { margin-bottom: 12px; }

    .info-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 40px; }
    .info-grid h3 { margin-top: 18px; }
    .note { margin-top: 28px; padding: 16px 22px; background: var(--grigio); color: var(--blu); }
    .note b { font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: var(--azzurro); margin-right: 10px; }
    .download { margin-top: 26px; }
    .download .btn { border-color: var(--azzurro); }

    .steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1.5px solid var(--blu); margin-top: 22px; }
    .steps > div { padding: 18px 20px; }
    .steps > div + div { border-left: 1.5px solid var(--blu); }
    .steps p { margin: 4px 0 0; font-size: .95rem; }
    .downloads { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 12px; }
    .dl { display: flex; flex-direction: column; gap: 4px; padding: 20px 22px; background: #F2F6FA; border-left: 5px solid var(--azzurro); color: var(--ink); text-decoration: none; }
    .dl strong { color: var(--blu); font-size: 1.05rem; }
    .dl span:last-child { font-size: .92rem; color: var(--muted); }
    .dl:hover { background: var(--tint); color: var(--ink); }
    .dl:hover strong { text-decoration: underline; }
    footer { background: var(--blu); color: #E6ECF2; text-align: center; padding: 28px 20px; font-size: .88rem; }
    footer .logos img { height: 40px; }
    footer p { margin: 14px 0 0; }

    @media (max-width: 820px) {
      body { font-size: 16px; }
      .hero-inner { padding: 26px 18px 32px; }
      .hero-grid, .two, .grid2, .info-grid { grid-template-columns: minmax(0, 1fr); }
      .hero-grid { text-align: center; }
      .two > div + div { border-left: 0; border-top: 1.5px solid var(--blu); }
      .grid2 article:nth-child(odd) { border-right: 0; }
      .grid2 article:nth-last-child(2) { border-bottom: 1.5px solid var(--blu); }
      .grid2 article { background: #fff !important; }
      section { padding: 28px 20px 32px; }
      .steps, .downloads { grid-template-columns: minmax(0, 1fr); }
      .steps > div + div { border-left: 0; border-top: 1.5px solid var(--blu); }
      .logos { gap: 14px; flex-wrap: nowrap; }
      .logos img { height: 34px; }
      .logos .sep { height: 28px; }
      nav ul { gap: 0 18px; }
      nav a { padding: 9px 0; font-size: .78rem; }
      .hero { padding: 20px 12px 36px; }
    }
    @media print { nav { display: none; } body { background: #fff; } section { break-inside: avoid-page; } }
  </style>
</head>
<body>
  {{ content }}
</body>
</html>
