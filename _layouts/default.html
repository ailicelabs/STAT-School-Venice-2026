<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #243447; background: #f5f7fa; font: 17px/1.7 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 1400px; margin: 48px auto; padding: 48px 40px; background: #fff; border-top: 6px solid #127c80; border-radius: 4px; }
    h1, h2, h3 { line-height: 1.2; color: #132e48; }
    h1 { font-size: clamp(2rem, 5vw, 3.1rem); margin: 0 0 12px; letter-spacing: -.035em; }
    h2 { margin: 42px 0 18px; font-size: 1.65rem; }
    h1 + h2 { margin-top: 0; color: #127c80; font-weight: 500; }
    h3 { margin-top: 30px; font-size: 1.15rem; }
    h1 + h2 + p { max-width: 850px; font-size: 1.2rem; color: #4d6377; }
    a { color: #07696d; text-underline-offset: .18em; }
    a:hover { color: #143a5c; }
    a:focus-visible { outline: 3px solid #127c80; outline-offset: 4px; }
    table { width: 100%; border-collapse: collapse; margin: 22px 0; font-size: .93rem; }
    th { text-align: left; background: #eaf3f3; color: #153d4c; }
    th, td { padding: 13px 15px; border-bottom: 1px solid #dfe6ed; vertical-align: top; }
    td:first-child { white-space: nowrap; font-variant-numeric: tabular-nums; }
    th:first-child { width: 12%; }
    th:nth-child(2) { width: 21%; }
    th:nth-child(3) { width: 23%; }
    th:nth-child(4) { width: 44%; }
    tr:nth-child(even) td { background: #f8fafc; }
    li { margin-bottom: 9px; }
    hr { border: 0; border-top: 1px solid #dfe6ed; margin: 36px 0; }
    footer { border-top: 1px solid #dfe6ed; margin-top: 44px; padding-top: 18px; font-size: .85rem; color: #576a7c; }
    @media (max-width: 1050px) {
      body { font-size: 16px; }
      main { margin: 0; padding: 30px 20px; border-radius: 0; }
      table { display: block; overflow-x: auto; }
      th, td { min-width: 150px; padding: 11px; }
      th:nth-child(2), td:nth-child(2) { min-width: 200px; }
      th:nth-child(3), td:nth-child(3) { min-width: 220px; }
      th:nth-child(4), td:nth-child(4) { min-width: 320px; }
    }
    @media print { body { background: white; } main { margin: 0; padding: 0; border: 0; } }
  </style>
</head>
<body>
  <main>
    {{ content }}
    <footer>STAT PhD School · 2–4 December 2026 · Provisional programme · Draft dated 15 October 2026</footer>
  </main>
</body>
</html>
